[package]
name = "rust-jev"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Bounded TypeSafe Jev Noul, Choice and Score HTTP adapter for RustDecision"
repository = "https://github.com/SoundBlaster/rust-jev"

[dependencies]
rust-decision = { git = "https://github.com/SoundBlaster/rust-decision", rev = "6964ab79a25f98ca99f7e3c1d603394e72cd2677" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
